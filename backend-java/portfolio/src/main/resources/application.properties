spring.application.name=portfolio
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
spring.datasource.username=portfolio
spring.datasource.password=portfolio
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

# JWT configuration — JWT_SECRET must be set as an environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin credentials — ADMIN_USERNAME and ADMIN_PASSWORD must be set as environment variables
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads