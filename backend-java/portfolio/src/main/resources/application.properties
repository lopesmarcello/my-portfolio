spring.application.name=portfolio
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
spring.datasource.username=portfolio
spring.datasource.password=portfolio
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

# JWT configuration — set JWT_SECRET env var in production; dev falls back to a safe default
jwt.secret=${JWT_SECRET:dev-only-secret-key-minimum-32-chars-x}
jwt.expiration=86400000

# Admin credentials — set ADMIN_USERNAME / ADMIN_PASSWORD env vars in production
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads